name: CI
on: [push, pull_request]

jobs:
  alpine:
    strategy:
      matrix:
        php-version:
          - "8.0-cli-alpine3.16"
          - "8.1-cli-alpine3.19"
          - "8.2-cli-alpine3.19"
          - "8.3-cli-alpine3.19"
          - "8.4-cli-alpine3.19"
          - "8.5-cli-alpine3.22"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test extension
        run: "docker build -t simdjsontest -f docker-alpine --build-arg BASE_IMAGE=${{ matrix.php-version }} ."

      - name: Show info
        run: "docker run --rm simdjsontest php --ri simdjson"

  ubuntu-dev:
    strategy:
      matrix:
        php-version:
          - "8.2.33"
          - "8.3.33"
          - "8.4.24"
          - "8.5.9"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gcc xz-utils libxml2-dev pkg-config make autoconf g++ valgrind

      - name: Build PHP
        run: |
          mkdir /tmp/php
          cd /tmp/php
          curl -L https://www.php.net/distributions/php-${{ matrix.php-version }}.tar.xz | tar --strip-components=1 -xJf -
          ./configure --enable-debug --without-sqlite3 --disable-pdo --disable-dom --disable-simplexml --disable-phar --without-pdo-sqlite
          make -j$(nproc)
          sudo make install

      - name: Build extension
        run: |
          phpize
          ./configure
          make -j$(nproc)

      - name: Run tests
        env:
          NO_INTERACTION: "true"
        run: make test TESTS="-m --show-diff -j$(nproc)"

  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        experimental: [false]
    runs-on: ${{ matrix.os }}
    name: PHP ${{ matrix.php-version }} Test on ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: json
          # for correct php-config extension dir, see https://github.com/shivammathur/setup-php/issues/147
          tools: pecl, phpize, php-config

      - name: Build extension
        run: |
          php-config --extension-dir
          phpize
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Run tests
        env:
            NO_INTERACTION: "true"
            SIMDJSON_HIGH_MEMORY_TESTS: "1"
        run: |
            make test TESTS="--show-diff -j2 -q"

      - name: Show
        run: "php -dextension=simdjson.so --ri simdjson"

      - name: Error log
        if: ${{ failure() }}
        run: "ls -1t tests/*.log | xargs -d'\n' cat"

      - name: Error diff
        if: ${{ failure() }}
        run: |
          for FILE in $(find tests -name '*.diff'); do
            echo $FILE
            cat $FILE
            echo
          done

  macos:
    runs-on: macos-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: none

      - name: Build extension
        run: |
          phpize
          ./configure
          make -j$(nproc)

      - name: Run tests
        env:
            SIMDJSON_HIGH_MEMORY_TESTS: "1"
        run: |
          make test TESTS="--show-diff -j2 -q"
