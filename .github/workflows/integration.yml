name: CI
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  ubuntu-dev:
    strategy:
      matrix:
        php-version:
          - "8.2.34"
          - "8.2.35"
          - "8.3.35"
          - "8.3.36"
          - "8.4.26"
          - "8.4.27"
          - "8.5.11"
          - "8.5.12"
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php-version }} in debug mode
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gcc xz-utils libxml2-dev pkg-config make autoconf g++ valgrind ccache

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-php-${{ runner.os }}-${{ matrix.php-version }}-${{ github.sha }}
          restore-keys: |
            ccache-php-${{ runner.os }}-${{ matrix.php-version }}-
            ccache-php-${{ runner.os }}-

      - name: Build PHP
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          mkdir /tmp/php
          cd /tmp/php
          curl -L https://www.php.net/distributions/php-${{ matrix.php-version }}.tar.xz | tar --strip-components=1 -xJf -
          ./configure --enable-debug --without-sqlite3 --disable-pdo --disable-dom --disable-simplexml --disable-phar --without-pdo-sqlite
          make -j$(nproc)
          sudo make install

      - name: Show ccache statistics
        run: ccache -s

      - name: Build extension
        run: |
          phpize
          ./configure
          make -j$(nproc)

      - name: Run tests
        env:
          NO_INTERACTION: "true"
        run: make test TESTS="-m --show-diff -j$(nproc)"

  ubuntu-no-simd-encoder:
    runs-on: ubuntu-latest
    name: PHP 8.5 Encoder without SIMD
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: json
          tools: phpize, php-config

      - name: Build extension with generic encoder
        run: |
          phpize
          CXXFLAGS="-DSIMDJSON_NO_SIMD_ENCODER" ./configure
          make -j$(nproc)

      - name: Check that generic encoder is used
        run: php -dextension=$PWD/modules/simdjson.so --ri simdjson | grep -i "Generic"

      - name: Run tests
        env:
          NO_INTERACTION: "true"
        run: make test TESTS="--show-diff -j2 -q"

  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"
        zts-mode:
          - ts
          - nts
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: PHP ${{ matrix.php-version }} on ${{ matrix.os }} ${{ matrix.zts-mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: json
          tools: phpize, php-config
        env:
          phpts: ${{ matrix.zts-mode }}

      - name: Build extension
        run: |
          phpize
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Run tests
        env:
            NO_INTERACTION: "true"
            SIMDJSON_HIGH_MEMORY_TESTS: "1"
        run: |
            make test TESTS="--show-diff -j2 -q"

      - name: Show info
        run: "php -dextension=simdjson.so --ri simdjson"

      - name: Error log
        if: ${{ failure() }}
        run: "ls -1t tests/*.log | xargs -d'\n' cat"

      - name: Error diff
        if: ${{ failure() }}
        run: |
          for FILE in $(find tests -name '*.diff'); do
            echo $FILE
            cat $FILE
            echo
          done

  macos:
    runs-on: macos-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php-version }} on macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json
          coverage: none
          tools: none

      - name: Build extension
        run: |
          phpize
          ./configure
          make -j$(nproc)

      - name: Run tests
        env:
            SIMDJSON_HIGH_MEMORY_TESTS: "1"
        run: |
          make test TESTS="--show-diff -j2 -q"
